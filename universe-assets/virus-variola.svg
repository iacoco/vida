<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" role="img" aria-labelledby="title desc">
  <title id="title">Representación esquemática de Variola virus</title>
  <desc id="desc">Virión de poxvirus con forma de ladrillo, envoltura estriada y núcleo central.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f4ef"/>
      <stop offset="1" stop-color="#c8dfd5"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d5b66"/>
      <stop offset="0.55" stop-color="#6c3e53"/>
      <stop offset="1" stop-color="#452a42"/>
    </linearGradient>
    <pattern id="ridges" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M0 5H28" stroke="#dfabb0" stroke-width="7" opacity=".58"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17352f" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="900" height="675" fill="url(#bg)"/>
  <g filter="url(#shadow)" transform="translate(154 105)">
    <rect x="0" y="0" width="592" height="465" rx="112" fill="url(#coat)" stroke="#3f2940" stroke-width="18"/>
    <rect x="20" y="20" width="552" height="425" rx="96" fill="url(#ridges)" opacity=".68"/>
    <path d="M176 86c54-40 186-40 240 0l46 82v130l-46 82c-54 40-186 40-240 0l-46-82V168z" fill="#e9d9b9" stroke="#342d43" stroke-width="18"/>
    <path d="M226 128c36-24 104-24 140 0l34 62v86l-34 62c-36 24-104 24-140 0l-34-62v-86z" fill="#a96b70" stroke="#5c384d" stroke-width="12"/>
    <path d="M86 137c42 25 61 62 61 96s-19 71-61 96" fill="none" stroke="#e3b77f" stroke-width="26" stroke-linecap="round"/>
    <path d="M506 137c-42 25-61 62-61 96s19 71 61 96" fill="none" stroke="#e3b77f" stroke-width="26" stroke-linecap="round"/>
    <g fill="#f0c9a7" opacity=".8">
      <circle cx="102" cy="83" r="12"/><circle cx="488" cy="91" r="11"/>
      <circle cx="82" cy="382" r="13"/><circle cx="512" cy="371" r="12"/>
    </g>
  </g>
</svg>
