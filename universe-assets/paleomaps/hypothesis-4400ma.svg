  </defs>
  <rect width="640" height="320" fill="url(#ocean)"/><rect width="640" height="320" fill="url(#grid)"/>
  <g fill="#b58b63" stroke="#f0d59e" stroke-opacity=".78" stroke-width="3" stroke-dasharray="7 7">
    <path d="M72 92c28-24 73-24 94 2s7 56-29 67-78-5-84-35 1-19 19-34Z"/>
