  </g>
  <g fill="#d8b475" opacity=".75"><circle cx="199" cy="50" r="6"/><circle cx="376" cy="105" r="4"/><circle cx="115" cy="241" r="5"/><circle cx="607" cy="94" r="4"/></g>
