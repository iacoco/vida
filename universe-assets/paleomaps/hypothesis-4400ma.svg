<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">Océanos tempranos y corteza dispersa, 4400 millones de años</title>
  <desc id="desc">Esquema hipotético basado en indicios de océanos y corteza temprana; la geometría y las posiciones no están reconstruidas.</desc>
